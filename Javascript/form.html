<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #222;
      }

      .box {
        min-height: 100vh;
      }

      .inpq {
        width: 300px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      input {
        padding: 10px;
      }
      .card {
        max-width: 200px;
        margin: 40px 20px;
        display: inline-block;
        border-radius: 16px;
        color: white;

        padding: 10px;
        border: 2px solid rgb(82, 80, 80);
      }
      .profile {
        width: 40px;
        height: 40px;

        border-radius: 50%;
        margin-bottom: 7px;
        overflow: hidden;
      }
      .profile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card h5 {
        margin-top: 3px;
      }
      .card p {
        font-size: 12px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <form action="">
          <div class="inpq">
        <input type="text" placeholder="Enter your profile pic" />
          <input type="text" placeholder="Enter your name" />
          <input type="text" placeholder="Enter your occuption" />
          <input type="text" placeholder="Enter your desp" />
          <input type="submit" placeholder="Enter your desp" />
        </div>
      </form>
      
    </div>
    <script>
      let form = document.querySelector("form");
      let inputs = document.querySelectorAll("input");
      let box = document.querySelector(".box");
      form.addEventListener("submit", function (dets) {
        dets.preventDefault();
        let card = document.createElement("div");
      card.classList.add("card");

      let profile = document.createElement("div");
      profile.classList.add("profile");

      let img = document.createElement("img");
      img.setAttribute("src",inputs[0].value);

      let h3 = document.createElement("h3");
      h3.textContent = inputs[1].value ;

      let h5 = document.createElement("h5");
      h5.textContent = inputs[2].value;

      let p = document.createElement("p");
      p.textContent = inputs[3].value;
      profile.appendChild(img);
      card.appendChild(profile);
      card.appendChild(h3);
      card.appendChild(h5);
      card.appendChild(p);
      box.appendChild(card);

      inputs.forEach(function(inp){
        if(inp.type!=="submit"){
             inp.value = "";

        }
       
      });
      });

      
    </script>
  </body>
</html>
