<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Countter</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100%;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            

        }
     .container{
        display: flex;
        gap: 2rem;
        border-radius: 50%;
        flex-direction: column;
            justify-content: center;
            align-items: center;
        height: 50vh;
        width: 70%;
        background-color: rgb(237, 250, 250);
        margin: auto;
     }
     input{
        padding:.5rem 2rem;
        border-radius: 2rem;
        border: none;
        outline: none;
     }
     h1{
        font-size: 60px;
     }

    </style>
</head>
<body>
    <div class="container">
        <h1>
            Live Character Counter
        </h1>
        <input type="text" placeholder="write here...">
        <div>
            <h2>Character count left = <span>20</span></h2>
        </div>

    </div>
    <script>
        let inp = document.querySelector('input');
        let span = document.querySelector("span");
        inp.addEventListener('input',function(){
            let char = 20 - inp.value.length;
            if(char<0){
                
                span.style.color = "red";
                span.textContent=char;
                alert(`OOPS,Limit hit character : ${char}`);
                }
            else{
                span.textContent=char;
                span.style.color = "black";
                
            }
            
            

            
        });
    </script>
    
</body>
</html>
