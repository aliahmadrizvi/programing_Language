<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100%;
        }
        .container{
            display: flex;
            justify-content: center;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
            background-color: rgb(58, 9, 9);
            height: 100%;
            width: 100%;
        }
        .card{
             display: flex;
            justify-content: center;
            align-items: center;
            height: 30rem;
            width: 30rem;
            border-radius: 2rem;
            border: 2px solid #bca9a9;

        }
        h2{
            font-size: 22rem;
            font-weight: 700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: italic;
            text-decoration: wavy;
            color: color-mix(in srgb-linear, rgb(208, 191, 191) 51%, rgb(47, 161, 47) 49%);
        }
        .btn{
            padding: 0.78rem 4rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.56rem;

        }
        h1{
            font-weight: 700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size:89px ;
            text-decoration: wavy;
            color: color-mix(in srgb-linear, rgb(208, 191, 191) 51%, rgb(47, 161, 47) 49%);

        }

    </style>
</head>
<body>
    <div class="container">
        <h1>TIMER</h2>
        <div class="card">
            <h2>:)</h2>
        </div>
        <div>
            <button id="stbtn" class="btn">Start</button>
        <button id="stpbtn" class="btn">Stop</button>
        </div>
    </div>


    <script>
        let ivl= null;
        let stbtn = document.querySelector("#stbtn");
        stbtn.addEventListener("click",function(dets){
        let second =50;
        let count = 20;
            if(ivl !== null ) return;
         ivl = setInterval(function(){
           
             if(count>=0){
                 document.querySelector('h2').textContent=`${count}`;
                 document.querySelector(".card").style.width ="30rem";
                 count--;
            }
            else{
                document.querySelector('h2').textContent="STOP";
                document.querySelector(".card").style.width ="58rem";
                clearInterval(ivl);
                ivl = null;
            }
        },(second*1000)/100);

        });
        let stpbtn = document.querySelector("#stpbtn");
        stpbtn.addEventListener("click",function(dets){
            clearInterval(ivl);
            document.querySelector('h2').textContent=":)"
            document.querySelector(".card").style.width ="30rem";

            ivl = null;
        })
        


    </script>
    
</body>
</html>
