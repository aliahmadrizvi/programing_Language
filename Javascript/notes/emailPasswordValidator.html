<html>
  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Form Validator</title>

      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          min-height: 100vh;
          background: #222;
          font-family: Verdana, Geneva, Tahoma, sans-serif;

          display: flex;
          justify-content: center;
          align-items: center;
        }

        .container {
          width: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        form {
          width: 350px;
          padding: 2rem;

          background: #2d2d2d;
          border: 2px solid #555;
          border-radius: 20px;

          box-shadow: 0 4px 15px rgba(167, 117, 117, 0.5);
        }

        h2 {
          text-align: center;
          color: white;
          margin-bottom: 1.5rem;
        }

        .field {
          width: 100%;
          margin-bottom: 1.2rem;
        }

        .inp {
          width: 100%;
          padding: 0.8rem 1rem;

          outline: none;
          border: 2px solid #555;
          border-radius: 8px;

          font-size: 1rem;
        }

        .inp:focus {
          border-color: #888;
        }

        .error {
          display: none;
          margin-top: 5px;
          margin-left: 5px;

          color: #ff4d4d;
          font-size: 0.75rem;
        }

        .btn {
          width: 100%;
          padding: 0.8rem;

          border: none;
          border-radius: 8px;

          background: #fff;
          color: #222;

          font-size: 1rem;
          font-weight: bold;
          cursor: pointer;
        }

        .btn:hover {
          transform: scale(1.02);
        }

        #result {
          color: white;
          display: none;
          margin-top: 1rem;
          text-align: center;
          font-size: 0.9rem;
        }
      </style>
    </head>

    <body>
      <div class="container">
        <form id="form">
          <h2>Form Validator</h2>

          <div class="field">
            <input
              type="text"
              id="username"
              class="inp"
              placeholder="Username"
            />
            <small id="usernameError" class="error"
              >not match the username format</small
            >
          </div>

          <div class="field">
            <input type="email" id="email" class="inp" placeholder="Email" />
            <small id="emailError" class="error"
              >not match the email format</small
            >
          </div>

          <div class="field">
            <input
              type="password"
              id="password"
              class="inp"
              placeholder="Password"
            />
            <small id="passwordError" class="error"
              >not match the password format</small
            >
          </div>

          <input type="submit" value="Submit" class="btn" />

          <div id="result">Nice You Got the succces</div>
        </form>
      </div>
      <script>
        let form = document.querySelector("form");
        let username = document.querySelector("#username");
        let email = document.querySelector("#email");
        let password = document.querySelector("#password");

        form.addEventListener("submit", function (dets) {
          dets.preventDefault();
          // Username
          const usernameRegex = /^[A-Za-z0-9_]{3,16}$/;
          let usernameCheck = usernameRegex.test(username.value);
          if (!usernameCheck) {
            let usernameError = document.querySelector("#usernameError");
            usernameError.style.display = "initial";
          }
          else{
            usernameError.style.display = "none";

          }

          // Email
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          let emailCheck = emailRegex.test(email.value);
          if (!emailCheck) {
            let emailError = document.querySelector("#emailError");
            emailError.style.display = "initial";
          }
          else{
            emailError.style.display = "none";

          }

          // Password
          const passwordRegex =
            /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
          let passwordCheck = passwordRegex.test(password.value);
          if (!passwordCheck) {
            let passwordError = document.querySelector("#passwordError");
            passwordError.style.display = "initial";
          }
          else{
           passwordError.style.display = "none";

          }
          if (usernameCheck && emailCheck && passwordCheck) {
            let result = document.querySelector("#result");

            result.style.display = "block";
           
          }
          else{
            result.style.display = "none";

          }
        });
      </script>
    </body>
  </html>
</html>
